name: galaxy

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "data/**"]

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # Needs a fine-grained token with read access to zeitiv/cv contents;
      # without it the committed data/cv.json is used as is
      - name: Sync cv.json
        env:
          CV_TOKEN: ${{ secrets.CV_TOKEN }}
        if: env.CV_TOKEN != ''
        run: bun scripts/sync-cv.ts
      - name: Draw
        run: bun scripts/galaxy.ts
      - name: Commit
        run: |
          git add data/cv.json assets/galaxy.svg
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Redraw the galaxy"
          git push
